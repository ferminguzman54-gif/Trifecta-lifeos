[theme]
base = "dark"
primaryColor = "#3B82F6"
backgroundColor = "#0A0D14"
secondaryBackgroundColor = "#121722"
textColor = "#F8FAFC"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
enableCORS = false
maxUploadSize = 15

[browser]
gatherUsageStats = false
